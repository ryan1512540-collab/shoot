<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>霓虹太空射擊</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  html,body{height:100%;overflow:hidden;background:#05060f;touch-action:none;
    overscroll-behavior:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;color:#eaf2ff}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;top:12px;left:14px;font-size:18px;font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;z-index:5;line-height:1.6}
  #hud .mult{color:#57ffb0}
  #hearts{position:fixed;top:12px;right:14px;max-width:48vw;font-size:16px;pointer-events:none;z-index:5;letter-spacing:1px;text-align:right;line-height:1.35}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:rgba(5,6,15,.78);backdrop-filter:blur(3px);
    text-align:center;padding:20px;z-index:10}
  #overlay.hidden{display:none}
  #overlay h2{font-size:34px;margin:0}
  #overlay p{line-height:1.8;opacity:.92;max-width:480px;margin:0}
  button{cursor:pointer;border:none;border-radius:12px;padding:12px 34px;font-size:18px;font-weight:700;
    color:#06121f;background:#4fd1ff;transition:transform .08s,filter .15s;margin-top:4px}
  button:hover{filter:brightness(1.1)} button:active{transform:translateY(1px)}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;opacity:.5;pointer-events:none;z-index:5}
  #ships{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}
  .ship{min-width:96px;max-width:120px;padding:8px 8px 10px;border-radius:12px;border:2px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:#eaf2ff;font-size:13px;font-weight:700;cursor:pointer;margin:0}
  .ship small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:3px;line-height:1.35}
  .ship.on{border-color:#4fd1ff;background:rgba(79,209,255,.2);box-shadow:0 0 0 1px #4fd1ff}
  #shipName{font-size:13px;opacity:.75}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="hud">得分 <span id="score">0</span><br>連擊 <span class="mult" id="mult">x1</span><br>波次 <span id="wave">1</span><br>火力 <span id="power">Lv1</span><br><span id="shipName">均衡</span></div>
<div id="hearts">❤❤❤</div>
<div id="hint">滑鼠/觸控拖曳移動 · 自動開火 · 可抵銷小兵子彈（魔王彈無法抵銷） · 吃道具強化</div>
<div id="overlay">
  <h2>🚀 霓虹太空射擊</h2>
  <p>拖曳控制戰機，自動開火擊破敵軍。<br>
     每 5 波出現魔王；打贏後小兵會逐步變強。魔王彈無法被抵銷。<br>
     掉落：<b>❤️</b> 加命（最多 10 顆） · <b>🔥</b> 火力/射速升級（可疊到 Lv6） · <b>🛡️</b> 護盾 · <b>⚡</b> 清場</p>
  <div id="ships"></div>
  <button id="btn">開始遊戲</button>
</div>

<script>
(function(){
  function stop(e){e.preventDefault();}
  ["gesturestart","gesturechange","gestureend","dblclick"].forEach(function(t){
    document.addEventListener(t,stop,{passive:false});
  });
  document.addEventListener("touchmove",function(e){
    if(e.touches.length>1)e.preventDefault();
  },{passive:false});
  var lastTap=0;
  document.addEventListener("touchend",function(e){
    var now=Date.now();
    if(now-lastTap<400)e.preventDefault();
    lastTap=now;
  },{passive:false});
})();
(() => {
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  let W=0,H=0;
  function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
  addEventListener('resize',resize); addEventListener('orientationchange',resize); resize();

  const elScore=document.getElementById('score'), elMult=document.getElementById('mult');
  const elWave=document.getElementById('wave'), elHearts=document.getElementById('hearts');
  const elPower=document.getElementById('power');
  const overlay=document.getElementById('overlay'), btn=document.getElementById('btn');
  const elShipName=document.getElementById('shipName');
  const POWER_MAX=6, LIFE_MAX=10;
  const POWER_RATE=[0,0.18,0.15,0.12,0.10,0.08,0.06];
  const POWER_SHOTS=[0,1,2,3,4,5,7];
  const SHIPS=[
    {id:'balance',name:'均衡',desc:'標準扇形彈',color:'#4fd1ff',body:'#eaf2ff'},
    {id:'rapid',name:'疾風',desc:'超高射速直線',color:'#57ffb0',body:'#d4fff0'},
    {id:'spread',name:'散華',desc:'廣角散彈',color:'#ffb057',body:'#ffe8c8'},
    {id:'pierce',name:'穿雲',desc:'子彈貫穿敵機',color:'#ffe566',body:'#fff4b0'},
    {id:'home',name:'追星',desc:'自動追蹤彈',color:'#c89bff',body:'#edd9ff'}
  ];
  let shipId='balance';
  function currentShip(){return SHIPS.find(s=>s.id===shipId)||SHIPS[0];}
  (function buildShips(){
    const box=document.getElementById('ships');
    SHIPS.forEach(s=>{
      const b=document.createElement('button');
      b.type='button';b.className='ship'+(s.id===shipId?' on':'');b.dataset.id=s.id;
      b.innerHTML=s.name+'<small>'+s.desc+'</small>';
      b.style.borderColor=s.color;
      b.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();selectShip(s.id);});
      box.appendChild(b);
    });
  })();
  function selectShip(id){
    shipId=id;
    document.querySelectorAll('.ship').forEach(el=>el.classList.toggle('on',el.dataset.id===id));
    elShipName.textContent=currentShip().name;
  }

  function loadBest(){try{return +(localStorage.getItem('shooter_best')||0);}catch(e){return 0;}}
  function saveBest(v){try{localStorage.setItem('shooter_best',v);}catch(e){}}

  // ---- 狀態 ----
  let running=false,last=0,score=0,best=loadBest();
  let combo=0, mult=1, wave=1, waveTimer=0, spawnTimer=0, shake=0, t=0;
  let boss=null, bossClearedWave=0;

  const player={x:W/2,y:H-120,r:16,lives:3,fireCd:0,fireRate:.18,
    power:1,shield:0,inv:0,tilt:0};

  let bullets=[], ebullets=[], enemies=[], parts=[], stars=[], drops=[];

  // 星空背景
  function initStars(){stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5,v:Math.random()*60+20});}
  initStars();

  const rand=(a,b)=>a+Math.random()*(b-a);
  function updHUD(){
    elScore.textContent=Math.floor(score);
    elMult.textContent='x'+mult;
    elWave.textContent=isBossWave()||boss?(wave+' 魔王'):wave;
    elPower.textContent=player.power>=POWER_MAX?'Lv6 滿等':'Lv'+player.power;
    elShipName.textContent=currentShip().name;
    elHearts.textContent='❤'.repeat(Math.max(0,player.lives))+'♡'.repeat(Math.max(0,LIFE_MAX-player.lives));
  }
  function applyPower(){
    player.power=Math.max(1,Math.min(POWER_MAX,player.power));
    const base=POWER_RATE[player.power];
    const mul={balance:1,rapid:0.5,spread:1.45,pierce:1.2,home:1.15}[shipId]||1;
    player.fireRate=Math.max(0.04,base*mul);
  }
  function addShot(x,y,vx,vy,opt){
    opt=opt||{};
    bullets.push({
      x:x,y:y,vx:vx,vy:vy,
      pierce:opt.pierce||0,home:opt.home||0,hit:null,
      color:opt.color||currentShip().color,w:opt.w||4,h:opt.h||12
    });
  }
  function shootVolley(){
    const p=player.power, ship=shipId, col=currentShip().color;
    const spd=700+p*40;
    if(ship==='rapid'){
      const n=1+Math.floor((p-1)/2);
      const gap=n===1?0:10;
      for(let i=0;i<n;i++){
        const ox=n===1?0:(i-(n-1)/2)*gap;
        addShot(player.x+ox,player.y-20,0,-spd-80,{color:col,w:3,h:14});
      }
      return;
    }
    if(ship==='spread'){
      const n=POWER_SHOTS[p]+2;
      const spread=0.28+p*0.06;
      for(let i=0;i<n;i++){
        const u=i/(n-1), ang=-spread/2+u*spread;
        addShot(player.x+(u-0.5)*34,player.y-14,Math.sin(ang)*spd, -Math.cos(ang)*spd,{color:col,w:3,h:10});
      }
      return;
    }
    if(ship==='pierce'){
      const n=p>=5?3:p>=3?2:1;
      for(let i=0;i<n;i++){
        const ox=n===1?0:(i-(n-1)/2)*14;
        addShot(player.x+ox,player.y-18,0,-spd,{color:col,w:6,h:16,pierce:1+Math.floor(p/2)});
      }
      return;
    }
    if(ship==='home'){
      const n=1+Math.floor((p-1)/2);
      for(let i=0;i<n;i++){
        const ox=n===1?0:(i-(n-1)/2)*16;
        const ang=ox*0.02;
        addShot(player.x+ox,player.y-16,Math.sin(ang)*spd,-Math.cos(ang)*spd,{color:col,w:5,h:10,home:0.07+p*0.015});
      }
      return;
    }
    const n=POWER_SHOTS[p];
    if(n<=1){addShot(player.x,player.y-20,0,-spd,{color:col});return;}
    const spread=0.06+p*0.035;
    for(let i=0;i<n;i++){
      const u=i/(n-1), ang=-spread/2+u*spread;
      addShot(player.x+(u-0.5)*26,player.y-16,Math.sin(ang)*spd,-Math.cos(ang)*spd,{color:col});
    }
  }

  function start(){
    score=0;combo=0;mult=1;wave=1;waveTimer=0;spawnTimer=0;shake=0;t=0;boss=null;bossClearedWave=0;
    player.x=W/2;player.y=H-120;player.lives=3;player.fireCd=0;
    player.power=1;applyPower();player.shield=0;player.inv=0;
    bullets=[];ebullets=[];enemies=[];parts=[];drops=[];
    initStars();
    running=true;overlay.classList.add('hidden');last=performance.now();
    requestAnimationFrame(loop);
  }
  function endGame(){
    running=false;
    if(score>best){best=Math.floor(score);saveBest(best);}
    overlay.querySelector('h2').textContent='💥 戰機墜毀';
    overlay.querySelector('p').innerHTML='最終得分 <b style="color:#4fd1ff">'+Math.floor(score)+'</b> · 撐到第 <b>'+wave+'</b> 波<br>最佳 '+Math.floor(best)+' · 再戰一次！';
    btn.textContent='再玩一次';
    overlay.classList.remove('hidden');
  }

  // ---- 敵機 ----
  function enemyGen(){return Math.max(0,Math.floor(bossClearedWave/5));}
  function spawnEnemy(){
    const g=enemyGen();
    const spd=1+g*0.2;
    const fireMul=Math.max(0.4,1-g*0.12);
    const type=Math.random();
    let e;
    if((wave>=5||g>0) && type<(0.12+g*0.07)){
      e={x:rand(40,W-40),y:-30,r:22,hp:5+g*2,vx:rand(-30,30)*spd,vy:rand(40,70)*spd,
         fire:rand(1,2)*fireMul,color:'#ff5470',score:50+g*20,kind:'heavy'};
    } else if(type<.4){
      e={x:rand(40,W-40),y:-30,r:16,hp:2+g,vx:rand(60,120)*(Math.random()<.5?1:-1)*spd,vy:rand(50,80)*spd,
         fire:rand(1.5,3)*fireMul,color:'#4fd1ff',score:20+g*10,kind:'zig'};
    } else {
      e={x:rand(40,W-40),y:-30,r:14,hp:1+Math.floor(g/2),vx:0,vy:rand(70,110)*spd,
         fire:Math.random()<.5?rand(2,4)*fireMul:0,color:'#57ffb0',score:10+g*6,kind:'straight'};
    }
    e.maxhp=e.hp;e.fireMul=fireMul;e.shotSpd=220*(1+g*0.12);
    enemies.push(e);
  }
  function isBossWave(){return wave>0&&wave%5===0;}
  function spawnBoss(){
    if(boss||bossClearedWave===wave)return;
    const n=Math.max(1,Math.floor(wave/5));
    const kind=n%3;
    const names=['哨艦魔王','環射魔王','追擊魔王'];
    const colors=['#ffb057','#4fd1ff','#ff5470'];
    const hp=70+wave*14+kind*18;
    boss={
      x:W/2,y:-80,r:52,hp:hp,maxhp:hp,vy:70,fire:0.4,phase:0,kind:kind,
      name:names[kind]+' #'+n,color:colors[kind],
      score:500+wave*60,entering:true,dir:1
    };
  }
  function addBossShot(x,y,vx,vy,r){
    ebullets.push({x:x,y:y,vx:vx,vy:vy,r:r||6,hard:true});
  }
  function bossShoot(){
    const b=boss;
    if(!b)return;
    if(ebullets.length>200)return;
    if(b.kind===0){
      for(let k=-3;k<=3;k++)addBossShot(b.x,b.y+28,k*70,230,6);
    }else if(b.kind===1){
      const n=12+Math.min(8,Math.floor(wave/5));
      for(let i=0;i<n;i++){
        const a=i/n*Math.PI*2+t;
        addBossShot(b.x,b.y,Math.cos(a)*180,Math.sin(a)*180,5);
      }
    }else{
      const a=Math.atan2(player.y-b.y,player.x-b.x);
      for(let k=-1;k<=1;k++){
        const ang=a+k*0.18;
        addBossShot(b.x,b.y+20,Math.cos(ang)*260,Math.sin(ang)*260,6);
      }
      addBossShot(b.x-36,b.y,-40,220,5);
      addBossShot(b.x+36,b.y,40,220,5);
    }
    if(b.hp<b.maxhp*0.45){
      const a=Math.atan2(player.y-b.y,player.x-b.x);
      addBossShot(b.x,b.y,Math.cos(a)*300,Math.sin(a)*300,7);
    }
  }

  function boom(x,y,color,n=14){
    if(parts.length>180)return;
    n=Math.min(n,20);
    for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(60,260);
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.3,.7),max:.7,r:rand(2,5),color});}
  }
  function trimArrays(){
    if(bullets.length>280)bullets.splice(0,bullets.length-280);
    if(ebullets.length>220)ebullets.splice(0,ebullets.length-220);
    if(parts.length>180)parts.splice(0,parts.length-180);
  }
  function defeatBoss(){
    if(!boss)return;
    const bx=boss.x,by=boss.y,bc=boss.color||'#ffb057',sc=boss.score||500;
    const fromWave=wave;
    boss=null;
    bossClearedWave=fromWave;
    wave=fromWave+1;
    waveTimer=0;
    bullets=bullets.filter(function(b){
      const dx=b.x-bx,dy=b.y-by;
      return dx*dx+dy*dy>90*90;
    });
    score+=sc*mult;combo+=10;mult=1+Math.min(9,Math.floor(combo/8));
    boom(bx,by,bc,20);shake=1.2;
    drop(bx,by);drop(bx-40,by);drop(bx+40,by);drop(bx,by-20);
  }
  function drop(x,y){
    if(Math.random()<.18){
      const r=Math.random();
      const type=r<.4?'heart':r<.7?'double':r<.9?'shield':'nuke';
      drops.push({x,y,vy:80,type,life:6});
    }
  }

  // ---- 輸入：綁在整個畫面，滑鼠移動或手指拖曳都能操控 ----
  let pointer={x:W/2,y:H-120,active:false};
  function setPointer(e){
    const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    if(t.clientX==null)return;
    pointer.x=t.clientX;pointer.y=t.clientY;pointer.active=true;
  }
  function onPlayMove(e){
    if(!running)return;
    if(e.cancelable)e.preventDefault();
    setPointer(e);
  }
  addEventListener('pointerdown',onPlayMove,{passive:false});
  addEventListener('pointermove',onPlayMove,{passive:false});
  addEventListener('touchstart',onPlayMove,{passive:false});
  addEventListener('touchmove',onPlayMove,{passive:false});
  addEventListener('mousemove',onPlayMove,{passive:false});
  function boot(e){
    if(e){e.preventDefault();e.stopPropagation();}
    if(!running)start();
  }
  btn.addEventListener('click',boot);
  btn.addEventListener('pointerdown',boot);

  // ---- 更新 ----
  function update(dt){
    t+=dt;
    // 玩家移動（朝指針平滑）
    const tx=pointer.active?pointer.x:W/2;
    const ty=pointer.active?Math.min(pointer.y,H-40):H-120;
    const px=player.x;
    player.x+=(tx-player.x)*Math.min(1,dt*14);
    player.y+=(ty-player.y)*Math.min(1,dt*14);
    player.tilt=THREE_lerp(player.tilt,(player.x-px)*.06,dt*10);
    player.x=Math.max(20,Math.min(W-20,player.x));
    player.y=Math.max(40,Math.min(H-20,player.y));
    player.inv=Math.max(0,player.inv-dt);
    player.shield=Math.max(0,player.shield-dt);
    shake=Math.max(0,shake-dt*3);

    // 開火
    player.fireCd-=dt;
    if(player.fireCd<=0){
      player.fireCd=player.fireRate;
      shootVolley();
    }

    // 波次與生成
    waveTimer+=dt;
    if(isBossWave() && !boss && waveTimer>1.2 && bossClearedWave!==wave){
      spawnBoss();
    }
    spawnTimer-=dt;
    const interval=Math.max(.22, 1.1 - wave*.05 - enemyGen()*0.08);
    if(spawnTimer<=0 && !isBossWave() && !boss){
      spawnTimer=interval;
      spawnEnemy();
    }
    if(waveTimer>15 && !isBossWave() && !boss){ wave++; waveTimer=0; }

    // 子彈
    for(const b of bullets){
      if(b.home){
        let tx=null,ty=null,best=1e12;
        for(const e of enemies){
          const d=(e.x-b.x)*(e.x-b.x)+(e.y-b.y)*(e.y-b.y);
          if(d<best){best=d;tx=e.x;ty=e.y;}
        }
        if(boss){
          const d=(boss.x-b.x)*(boss.x-b.x)+(boss.y-b.y)*(boss.y-b.y);
          if(d<best){tx=boss.x;ty=boss.y;}
        }
        if(tx!=null){
          const ang=Math.atan2(ty-b.y,tx-b.x);
          const spd=Math.hypot(b.vx,b.vy)||700;
          b.vx=b.vx*(1-b.home)+Math.cos(ang)*spd*b.home;
          b.vy=b.vy*(1-b.home)+Math.sin(ang)*spd*b.home;
        }
      }
      b.x+=(b.vx||0)*dt;b.y+=b.vy*dt;
    }
    bullets=bullets.filter(b=>b.y>-20&&b.x>-40&&b.x<W+40);
    // 敵機子彈
    for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
    ebullets=ebullets.filter(b=>b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);

    // 己方子彈抵銷敵彈
    for(let i=ebullets.length-1;i>=0;i--){
      const eb=ebullets[i];
      if(eb.hard)continue;
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        const dx=b.x-eb.x,dy=b.y-eb.y;
        const r=(eb.r||5)+6;
        if(dx*dx+dy*dy<r*r){
          bullets.splice(j,1);
          ebullets.splice(i,1);
          break;
        }
      }
    }
    trimArrays();

    // 敵機
    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      if(e.kind==='zig'){e.x+=Math.sin(t*4+e.y*.02)*1.5;if(e.x<20||e.x>W-20)e.vx*=-1;}
      e.fire-=dt;
      if(e.fire<=0 && e.y>0 && e.y<H-150){
        e.fire=(e.kind==='heavy'?rand(1,1.8):rand(2,3.5))*(e.fireMul||1);
        const a=Math.atan2(player.y-e.y,player.x-e.x);
        const sp=e.shotSpd||220;
        ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,hard:false});
      }
      if(e.y>H+40){enemies.splice(i,1);continue;}
      // 子彈打敵
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        const dx=b.x-e.x,dy=b.y-e.y;
        if(b.hit===e)continue;
        if(dx*dx+dy*dy<(e.r+4)*(e.r+4)){
          e.hp--;
          boom(b.x,b.y,e.color,4);
          if(b.pierce>0){b.pierce--;b.hit=e;}
          else bullets.splice(j,1);
          if(e.hp<=0){
            score+=e.score*mult; combo++; mult=1+Math.min(9,Math.floor(combo/8));
            boom(e.x,e.y,e.color,18); drop(e.x,e.y); shake=.4;
            enemies.splice(i,1);
          }
          break;
        }
      }
    }

    // Boss
    if(boss && boss.hp<=0)defeatBoss();
    if(boss){
      if(boss.entering){boss.y+=boss.vy*dt;if(boss.y>=110){boss.y=110;boss.entering=false;}}
      else{
        const dir=boss.dir||1;
        boss.x+=dir*(90+wave*4)*dt;
        if(boss.x<70||boss.x!==boss.x){boss.x=70;boss.dir=1;}
        if(boss.x>W-70){boss.x=W-70;boss.dir=-1;}
        boss.y=110+Math.sin(t*1.4)*16;
        boss.fire-=dt;
        if(boss.fire<=0){
          boss.fire=boss.kind===1?1.35:boss.kind===2?0.85:1.05;
          if(boss.hp<boss.maxhp*0.45)boss.fire*=0.75;
          bossShoot();
        }
      }
      for(let j=bullets.length-1;j>=0;j--){
        if(!boss)break;
        const b=bullets[j];
        const dx=b.x-boss.x,dy=b.y-boss.y;
        if(b.hit==='boss')continue;
        if(dx*dx+dy*dy<(boss.r+4)*(boss.r+4)){
          boss.hp--;
          if(b.pierce>0){b.pierce--;b.hit='boss';}
          else bullets.splice(j,1);
          if(boss.hp<=0){defeatBoss();break;}
        }
      }
    }

    // 敵機/子彈撞玩家
    if(player.inv<=0){
      let hit=false;
      for(let i=enemies.length-1;i>=0;i--){
        const e=enemies[i];const dx=e.x-player.x,dy=e.y-player.y;
        if(dx*dx+dy*dy<(e.r+player.r)*(e.r+player.r)){boom(e.x,e.y,e.color,16);enemies.splice(i,1);hit=true;break;}
      }
      if(!hit)for(let i=ebullets.length-1;i>=0;i--){
        const b=ebullets[i];const dx=b.x-player.x,dy=b.y-player.y;
        if(dx*dx+dy*dy<(b.r+player.r)*(b.r+player.r)){ebullets.splice(i,1);hit=true;break;}
      }
      if(boss&&!boss.entering){const dx=boss.x-player.x,dy=boss.y-player.y;
        if(dx*dx+dy*dy<(boss.r+player.r)*(boss.r+player.r))hit=true;}
      if(hit){
        if(player.shield>0){player.shield=0;player.inv=1;boom(player.x,player.y,'#4fd1ff',16);}
        else{
          player.lives--;combo=0;mult=1;player.inv=1.5;shake=1;
          boom(player.x,player.y,'#ff5470',24);
          if(player.lives<=0){updHUD();endGame();return;}
        }
      }
    }

    // 道具
    for(let i=drops.length-1;i>=0;i--){
      const d=drops[i];d.y+=d.vy*dt;d.life-=dt;
      const dx=d.x-player.x,dy=d.y-player.y;
      if(dx*dx+dy*dy<(player.r+14)*(player.r+14)){
        if(d.type==='heart')player.lives=Math.min(LIFE_MAX,player.lives+1);
        else if(d.type==='double'){player.power=Math.min(POWER_MAX,player.power+1);applyPower();}
        else if(d.type==='shield')player.shield=5;
        else if(d.type==='nuke'){for(const e of enemies){boom(e.x,e.y,e.color,10);score+=e.score*mult;}enemies.length=0;
          for(const b of ebullets)boom(b.x,b.y,'#fff',3);ebullets.length=0;shake=.8;}
        drops.splice(i,1);
      } else if(d.life<=0||d.y>H+20)drops.splice(i,1);
    }

    // 粒子
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
    parts=parts.filter(p=>p.life>0);
    // 星星
    for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W;}}

    updHUD();
  }
  function THREE_lerp(a,b,t){return a+(b-a)*t;}

  // ---- 繪製 ----
  function draw(){
    ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);
    // 星星
    ctx.fillStyle='#fff';
    for(const s of stars){ctx.globalAlpha=s.s/2.5;ctx.fillRect(s.x,s.y,s.s,s.s*3);}
    ctx.globalAlpha=1;

    ctx.save();
    if(shake>0)ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14);

    // 道具
    for(const d of drops){
      ctx.save();ctx.translate(d.x,d.y);
      ctx.globalAlpha=d.life<1?(d.life):1;
      const icon=d.type==='heart'?'❤️':d.type==='double'?'🔥':d.type==='shield'?'🛡️':'⚡';
      ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(icon,0,0);ctx.restore();
    }
    ctx.globalAlpha=1;

    // 子彈
    for(const b of bullets){
      ctx.fillStyle=b.color||'#57ffb0';
      ctx.fillRect(b.x-(b.w||4)/2,b.y-(b.h||12)/2,b.w||4,b.h||12);
    }
    // 敵機子彈
    for(const b of ebullets){
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);
      ctx.fillStyle=b.hard?'#ffb057':'#ff5470';
      ctx.fill();
      if(b.hard){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
    }

    // 敵機
    for(const e of enemies)drawEnemy(e);
    if(boss)drawBoss();

    // 玩家
    drawPlayer();

    // 粒子
    for(const p of parts){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.restore();

    // Boss 血條
    if(boss){
      const w=Math.min(420,W*.74),x=(W-w)/2;
      ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(x-4,48,w+8,28);
      ctx.fillStyle=boss.color;ctx.font='bold 13px system-ui';ctx.textAlign='center';
      ctx.fillText((boss.entering?'▼ ':'')+boss.name,W/2,58);
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x,64,w,8);
      ctx.fillStyle=boss.color;ctx.fillRect(x,64,w*Math.max(0,boss.hp/boss.maxhp),8);
    }
  }
  function drawPlayer(){
    const p=player;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);
    if(p.inv>0&&Math.floor(t*20)%2)ctx.globalAlpha=.4;
    // 護盾
    if(p.shield>0){ctx.strokeStyle='rgba(79,209,255,.8)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,p.r+8,0,7);ctx.stroke();}
    const ship=currentShip();
    ctx.fillStyle=ship.body;
    ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(14,12);ctx.lineTo(0,4);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();
    ctx.fillStyle=ship.color;
    ctx.beginPath();ctx.moveTo(-14,12);ctx.lineTo(-22,16);ctx.lineTo(-10,6);ctx.closePath();
    ctx.moveTo(14,12);ctx.lineTo(22,16);ctx.lineTo(10,6);ctx.closePath();ctx.fill();
    if(shipId==='pierce'){
      ctx.fillStyle=ship.color;
      ctx.fillRect(-2,-22,4,10);
    }
    // 尾焰
    const f=Math.sin(t*30)*4;
    ctx.fillStyle='#ffb057';
    ctx.beginPath();ctx.moveTo(-4,12);ctx.lineTo(0,22+f);ctx.lineTo(4,12);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  function drawEnemy(e){
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle=e.color;
    if(e.kind==='heavy'){
      ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-e.r*.5);ctx.lineTo(0,-e.r*.2);ctx.lineTo(e.r,-e.r*.5);ctx.closePath();ctx.fill();
    } else {
      ctx.beginPath();ctx.moveTo(0,e.r);ctx.lineTo(-e.r,-e.r*.6);ctx.lineTo(e.r,-e.r*.6);ctx.closePath();ctx.fill();
    }
    // 血條
    if(e.hp<e.maxhp){ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(-e.r,-e.r-6,e.r*2,3);
      ctx.fillStyle='#fff';ctx.fillRect(-e.r,-e.r-6,e.r*2*(e.hp/e.maxhp),3);}
    ctx.restore();
  }
  function drawBoss(){
    const b=boss;
    ctx.save();ctx.translate(b.x,b.y);
    ctx.fillStyle=b.color;
    if(b.kind===1){
      ctx.beginPath();ctx.arc(0,0,b.r*.85,0,7);ctx.fill();
      ctx.fillStyle='#0a0c1e';ctx.beginPath();ctx.arc(0,0,b.r*.35,0,7);ctx.fill();
    }else if(b.kind===2){
      ctx.beginPath();
      ctx.moveTo(0,b.r);ctx.lineTo(-b.r*.9,-b.r*.2);ctx.lineTo(-b.r*.4,-b.r);ctx.lineTo(b.r*.4,-b.r);ctx.lineTo(b.r*.9,-b.r*.2);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,8,b.r*.22,0,7);ctx.fill();
    }else{
      ctx.beginPath();
      ctx.moveTo(0,b.r);ctx.lineTo(-b.r,0);ctx.lineTo(-b.r*.6,-b.r);ctx.lineTo(b.r*.6,-b.r);ctx.lineTo(b.r,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='#ff5470';ctx.beginPath();ctx.arc(0,0,b.r*.3,0,7);ctx.fill();
    }
    ctx.restore();
  }

  function loop(now){
    if(!running)return;
    let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
    try{update(dt);draw();}catch(err){console.error(err);}
    requestAnimationFrame(loop);
  }

  // 初始畫面
  ctx.fillStyle='#05060f';ctx.fillRect(0,0,W,H);
  updHUD();
})();
</script>
